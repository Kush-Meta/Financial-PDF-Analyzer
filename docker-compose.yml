services:
  pdf-analyzer:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE=http://host.docker.internal:11434
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=25
      - SEC_USER_AGENT
    restart: unless-stopped
