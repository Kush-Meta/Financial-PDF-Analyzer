[server]
maxUploadSize = 25
# Reload imported project modules reliably without an optional watchdog install.
fileWatcherType = "poll"

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#2F4FE0"
backgroundColor = "#EEF1F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#10182B"
font = "sans serif"
